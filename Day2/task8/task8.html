<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Zoom on Hover</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
  }

 
  .image-container {
    display: inline-block;
    overflow: hidden;
    border-radius: 8px; 
  }

  /* Image styling */
  .image-container img {
    width: 300px;
    height: auto;
    transition: transform 0.3s ease;
    display: block;
  }

 
  .image-container:hover img {
    transform: scale(1.2); 
  }
</style>
</head>
<body>
    
    <!-- Excercise -8 -->


<h2>Hover Over the Image</h2>
<div class="image-container">
  <img src="https://wallpapers.com/images/high/profile-picture-spirit-knight-k2ar09ggd5uvxwi1.webp" alt="Sample Image">
</div>




















</body>
</html>
