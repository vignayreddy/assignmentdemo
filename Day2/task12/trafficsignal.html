<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic signal</title>
    <style>
        .root{
             display: flex;
                flex-direction: column;
                text-align: center;
                align-items: center;
                animation-name: traffic;
                
                
                
        }
        .allcolors
        {       
                margin-top: 160px;
                border:2px solid black;
                width:fit-content;
                background-color: black;
                padding: 5px;
                border-radius: 30px;
                height:auto;
                width: auto;
               
                
        }
        .red{
            height: 50px;
            width: 50px;
            background-color: red;
            margin: 5px;
            border-radius: 30px;
            animation: trafficRed 6s infinite;
            
        }
        .yellow{
            height: 50px;
            width: 50px;
            margin: 5px;
             border-radius: 30px;
            background-color: yellow;
            animation: trafficYellow 6s infinite;
            animation-delay: 2s;
        }
        .green{
            height: 50px;
            width: 50px;
            margin: 5px;
             border-radius: 30px;
            background-color: rgb(0, 255, 13);
            animation: trafficGreen 6s infinite;
            animation-delay: 4s;
        }
        @keyframes trafficRed {
        0%, 33.33% { background-color: red; }
        33.34%, 100% { background-color: #330000; }
        }
        @keyframes trafficYellow {
        0%, 33.33% { background-color: yellow; }
        33.34%, 100% { background-color: #333300; }
        } 
        @keyframes trafficGreen {
        0%, 33.33% { background-color: rgb(0, 255, 13); }
        33.34%, 100% { background-color: #003300; }
        }


    </style>
</head>
<body>
    <div class="root">
            <div class="allcolors">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>
    </div>
    </div>
    
</body>
</html>
