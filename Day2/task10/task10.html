<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task10 Fixed</title>
    <style>
        .circles{
            background-color: rgb(197, 34, 34);
            border-radius: 30px;
        }
        .circleleftright {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color: rgb(34, 197, 159);
            
            
            position: absolute; 
            
            animation-name: moveBall;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction:alternate;
            animation-timing-function: ease-in-out;
        }

        @keyframes moveBall {
            0% {
                left: 100px;
            }
            100% {
                
                left: 70%;
            }
        }
    </style>
</head>
<body>
    <div class="circles">
        <div class="circleleftright"></div>
    </div>
   
</body>
</html>
